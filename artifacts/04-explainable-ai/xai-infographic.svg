<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1770px" version="1.1" viewBox="0 0 1400 1770" width="1400px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#f7f7f3" height="1770" width="1400" x="0" y="0" /><rect fill="#101927" height="253" rx="0" ry="0" stroke="none" stroke-width="1" width="1400" x="0" y="0" /><rect fill="#2c394b" height="37" rx="17" ry="17" stroke="none" stroke-width="1" width="165" x="74" y="51" /><text fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1px" x="94" y="77">ARTIFACT 04  /  XAI</text><text fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700" x="74" y="157">EXPLAINABLE AI</text><text fill="#d0d6df" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" x="77" y="206">A practical map from persuasive answers to evidence-based trust.</text><text fill="#e8755c" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2px" x="74" y="312">01  /  WHY EXPLAINABILITY MATTERS</text><text fill="#182130" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" x="74" y="359">A fluent answer is not the same as an explained decision.</text><rect fill="#ffffff" height="123" rx="18" ry="18" stroke="#d7dfe1" stroke-width="1" width="355" x="74" y="391" /><rect fill="#3a649d" height="73" rx="2" ry="2" stroke="none" stroke-width="1" width="7" x="93" y="412" /><text fill="#3a649d" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="1px" x="117" y="440">INPUT</text><text fill="#182130" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" x="117" y="481">What information was used?</text><rect fill="#ffffff" height="123" rx="18" ry="18" stroke="#d7dfe1" stroke-width="1" width="355" x="524" y="391" /><rect fill="#6c5b9c" height="73" rx="2" ry="2" stroke="none" stroke-width="1" width="7" x="543" y="412" /><text fill="#6c5b9c" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="1px" x="567" y="440">MODEL</text><text fill="#182130" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" x="567" y="481">What influenced its output?</text><rect fill="#ffffff" height="123" rx="18" ry="18" stroke="#d7dfe1" stroke-width="1" width="355" x="974" y="391" /><rect fill="#207e70" height="73" rx="2" ry="2" stroke="none" stroke-width="1" width="7" x="993" y="412" /><text fill="#207e70" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="1px" x="1017" y="440">OUTPUT</text><text fill="#182130" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" x="1017" y="481">Can the claim be verified?</text><line stroke="#e8755c" stroke-width="4" x1="453" x2="492" y1="454" y2="454" /><polygon fill="#e8755c" points="492,454 478,445 478,463" /><line stroke="#e8755c" stroke-width="4" x1="904" x2="943" y1="454" y2="454" /><polygon fill="#e8755c" points="943,454 929,445 929,463" /><text fill="#556275" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" x="75" y="556">XAI helps people question, audit, and communicate model behavior.</text><text fill="#e8755c" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2px" x="74" y="630">02  /  FOUR EXPLAINABILITY CHALLENGES</text><rect fill="#e8f0fa" height="132" rx="18" ry="18" stroke="none" stroke-width="1" width="615" x="74" y="658" /><rect fill="#ffffff" height="42" rx="11" ry="11" stroke="none" stroke-width="1" width="43" x="97" y="679" /><text fill="#3a649d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" x="105" y="707">01</text><text fill="#182130" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="159" y="711">BLACK-BOX COMPLEXITY</text><text fill="#556275" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" x="100" y="749">Billions of interactions make a</text><text fill="#556275" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" x="100" y="774">single causal story difficult.</text><rect fill="#fcebe6" height="132" rx="18" ry="18" stroke="none" stroke-width="1" width="615" x="711" y="658" /><rect fill="#ffffff" height="42" rx="11" ry="11" stroke="none" stroke-width="1" width="43" x="734" y="679" /><text fill="#e8755c" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" x="742" y="707">02</text><text fill="#182130" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="796" y="711">PLAUSIBLE ≠ FAITHFUL</text><text fill="#556275" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" x="737" y="749">A generated rationale may sound</text><text fill="#556275" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" x="737" y="774">convincing yet miss the actual cause.</text><rect fill="#e7f4ed" height="132" rx="18" ry="18" stroke="none" stroke-width="1" width="615" x="74" y="813" /><rect fill="#ffffff" height="42" rx="11" ry="11" stroke="none" stroke-width="1" width="43" x="97" y="834" /><text fill="#207e70" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" x="105" y="862">03</text><text fill="#182130" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="159" y="866">DATA &amp; SOCIAL BIAS</text><text fill="#556275" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" x="100" y="904">Unrepresentative inputs can create</text><text fill="#556275" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" x="100" y="929">uneven results across groups.</text><rect fill="#f0ebf8" height="132" rx="18" ry="18" stroke="none" stroke-width="1" width="615" x="711" y="813" /><rect fill="#ffffff" height="42" rx="11" ry="11" stroke="none" stroke-width="1" width="43" x="734" y="834" /><text fill="#6c5b9c" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" x="742" y="862">04</text><text fill="#182130" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="796" y="866">OVERSIGHT &amp; PRIVACY</text><text fill="#556275" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" x="737" y="904">Access limits, sensitive data, and</text><text fill="#556275" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" x="737" y="929">regulatory duties constrain review.</text><text fill="#e8755c" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2px" x="74" y="1030">03  /  VALIDATE WHAT THE MODEL CLAIMS</text><text fill="#182130" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" x="74" y="1075">Interpretation and evaluation answer different questions.</text><rect fill="#ffffff" height="188" rx="18" ry="18" stroke="#d7dfe1" stroke-width="1" width="400" x="74" y="1100" /><rect fill="#3a649d" height="45" rx="3" ry="3" stroke="none" stroke-width="1" width="11" x="94" y="1122" /><text fill="#3a649d" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="1px" x="123" y="1153">EXPLAIN</text><text fill="#182130" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" x="94" y="1200">Map features, examples, or circuits</text><text fill="#182130" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" x="94" y="1232">What might drive the response?</text><rect fill="#ffffff" height="188" rx="18" ry="18" stroke="#d7dfe1" stroke-width="1" width="400" x="499" y="1100" /><rect fill="#e8755c" height="45" rx="3" ry="3" stroke="none" stroke-width="1" width="11" x="519" y="1122" /><text fill="#e8755c" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="1px" x="548" y="1153">TEST</text><text fill="#182130" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" x="519" y="1200">Use held-out prompts, counterfactuals,</text><text fill="#182130" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" x="519" y="1232">and adversarial or edge-case trials.</text><rect fill="#ffffff" height="188" rx="18" ry="18" stroke="#d7dfe1" stroke-width="1" width="400" x="924" y="1100" /><rect fill="#207e70" height="45" rx="3" ry="3" stroke="none" stroke-width="1" width="11" x="944" y="1122" /><text fill="#207e70" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="1px" x="973" y="1153">MEASURE</text><text fill="#182130" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" x="944" y="1200">Report task quality, faithfulness,</text><text fill="#182130" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" x="944" y="1232">subgroup gaps, and stability.</text><text fill="#556275" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" x="76" y="1326">Examples of useful checks: factuality / groundedness · F1 on labeled tasks ·</text><text fill="#556275" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" x="76" y="1355">paraphrase stability · bias gaps · human review. None alone proves trust.</text><text fill="#e8755c" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2px" x="74" y="1435">04  /  INDUSTRY RESEARCH DIRECTIONS</text><rect fill="#e8f0fa" height="117" rx="16" ry="16" stroke="none" stroke-width="1" width="615" x="74" y="1460" /><text fill="#3a649d" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1px" x="96" y="1489">OPENAI</text><text fill="#182130" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" x="96" y="1524">Sparse autoencoders:</text><text fill="#182130" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" x="96" y="1553">interpretable features in GPT-4</text><rect fill="#fcebe6" height="117" rx="16" ry="16" stroke="none" stroke-width="1" width="615" x="711" y="1460" /><text fill="#e8755c" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1px" x="733" y="1489">ANTHROPIC</text><text fill="#182130" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" x="733" y="1524">Circuit tracing:</text><text fill="#182130" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" x="733" y="1553">attribution graphs in Claude</text><rect fill="#e7f4ed" height="117" rx="16" ry="16" stroke="none" stroke-width="1" width="615" x="74" y="1586" /><text fill="#207e70" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1px" x="96" y="1615">GOOGLE DEEPMIND</text><text fill="#182130" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" x="96" y="1650">Gemma Scope 2:</text><text fill="#182130" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" x="96" y="1679">tools to inspect Gemma</text><rect fill="#f0ebf8" height="117" rx="16" ry="16" stroke="none" stroke-width="1" width="615" x="711" y="1586" /><text fill="#6c5b9c" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1px" x="733" y="1615">META AI</text><text fill="#182130" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" x="733" y="1650">LM Transparency Tool:</text><text fill="#182130" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" x="733" y="1679">inspect transformer predictions</text><rect fill="#101927" height="47" rx="0" ry="0" stroke="none" stroke-width="1" width="1400" x="0" y="1723" /><text fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="1px" x="74" y="1753">AUDIT LOOP  ·  ASK → INSPECT → TEST → DOCUMENT → MONITOR</text><text fill="#cbd2dc" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" x="1179" y="1753">XINYUE WANG</text></svg>